<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root { --stone: #1d1c1a; --stone2: #282623; --stone3: #312e2a; --line: #3d3a35; --ink: #ece6da; --dim: #a69f92;
          --rune: #d9a441; --moss: #7fa36b; --rare: #c9a8f0; }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--stone); color: var(--ink);
               font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }
  header { padding: 14px 0 10px; border-bottom: 3px double var(--line); }
  h1 { margin: 0; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--rune); }
  h2 { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--rune);
       margin: 24px 0 8px; font-weight: 600; }
  .sub { color: var(--dim); font-size: 13.5px; }
  p { margin: 8px 0; }
  details.explain { margin: 14px 0 0; background: var(--stone2); border: 1px solid var(--line); border-radius: 10px;
                    padding: 10px 14px; }
  details.explain summary { cursor: pointer; color: var(--rune); font-weight: 600; }
  details.explain h3 { font-size: 14px; margin: 14px 0 2px; }
  details.explain p { margin: 2px 0 6px; font-size: 14.5px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .card { display: flex; flex-direction: column; align-items: stretch; text-align: left; gap: 4px;
          background: var(--stone2); color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
          padding: 10px; font: inherit; cursor: pointer; min-width: 0; }
  .card:focus-visible { outline: 2px solid var(--rune); outline-offset: 2px; }
  .card .art { height: 64px; display: grid; place-items: center; background: var(--stone); border-radius: 8px; }
  .card .art svg { width: 64px; height: 56px; }
  .card .name { font-weight: 600; font-size: 14.5px; line-height: 1.25; overflow-wrap: anywhere; }
  .card .meta { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; font-size: 12.5px; color: var(--dim); }
  .card.missing { background: transparent; border-style: dashed; }
  .card.missing .name { color: var(--dim); }
  .card.missing .art svg { opacity: .35; }
  .chip { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
          border: 1px solid currentColor; border-radius: 99px; padding: 0 7px; white-space: nowrap; }
  .chip.Common { color: var(--dim); } .chip.Uncommon { color: var(--moss); } .chip.Rare { color: var(--rare); }
  .now { color: var(--rune); font-weight: 700; }
  /* the card, opened */
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end;
           justify-content: center; z-index: 10; }
  .sheet .box { background: var(--stone2); border: 1px solid var(--line); border-radius: 14px 14px 0 0; width: 100%;
                max-width: 640px; max-height: 88vh; overflow-y: auto; padding: 16px 16px 24px; }
  @media (min-width: 700px) { .sheet { align-items: center; } .sheet .box { border-radius: 14px; } }
  .sheet .top { display: flex; gap: 12px; align-items: center; }
  .sheet .top .art { flex: none; width: 76px; height: 68px; display: grid; place-items: center; background: var(--stone);
                     border-radius: 10px; }
  .sheet .top .art svg { width: 64px; height: 56px; }
  .sheet h2 { margin: 0 0 4px; font-size: 18px; letter-spacing: 0; text-transform: none; color: var(--ink); }
  .close { margin-left: auto; align-self: flex-start; background: transparent; color: var(--dim); border: 1px solid var(--line);
           border-radius: 8px; padding: 4px 10px; font: inherit; cursor: pointer; }
  table.facts { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 14px; }
  table.facts th { text-align: left; color: var(--dim); font-weight: 500; padding: 4px 10px 4px 0; vertical-align: top;
                   white-space: nowrap; }
  table.facts td { padding: 4px 0; }
  .dyk { border-left: 3px solid var(--rune); padding: 4px 0 4px 10px; margin: 12px 0; }
  .dyk b { color: var(--rune); }
  .mine { margin: 12px 0; }
  .mine ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .mine li { background: var(--stone); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 13.5px; }
  .mine li.bold { border-color: var(--rune); }
  .mine li span { display: block; color: var(--dim); font-size: 12px; }
  .sources a { color: var(--rune); overflow-wrap: anywhere; }
  .sources ul { margin: 4px 0 0; padding-left: 18px; font-size: 13.5px; }
  .empty { color: var(--dim); }
</style>
<script src="/lang.js"></script>
<script src="/auth.js"></script>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<main>
  <header>
    <h1 id="title" data-nolang></h1>
    <div class="sub" id="subtitle"></div>
    <div id="score" hidden style="margin-top:6px"></div>
  </header>
  <p class="sub" id="intro"></p>
  <details class="explain" id="explain"><summary id="explainTitle"></summary><div id="explainBody"></div></details>
  <div id="groups"></div>
  <div id="extras"></div>
</main>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="cardTitle">
  <div class="box" id="sheetBox"></div>
</div>
<script>
const DATA = __DATA__;
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
// little pictures: gadget kinds drawn in a few lines, and constellations from their stars
const ICONS = {
  phone: '<rect x="22" y="6" width="20" height="44" rx="4"/><path d="M29 44h6"/>',
  laptop: '<rect x="14" y="12" width="36" height="24" rx="2"/><path d="M8 42h48l-4 4H12z"/>',
  earbuds: '<path d="M18 14a8 8 0 1 1 0 16v12"/><path d="M46 14a8 8 0 1 0 0 16v12"/>',
  speaker: '<rect x="18" y="8" width="28" height="42" rx="4"/><circle cx="32" cy="34" r="8"/><circle cx="32" cy="17" r="3"/>',
  watch: '<rect x="20" y="16" width="24" height="26" rx="6"/><path d="M24 16l2-8h12l2 8M24 42l2 8h12l2-8M32 24v6l4 3"/>',
  heart: '<path d="M32 48C14 36 10 26 16 18c5-6 12-4 16 2 4-6 11-8 16-2 6 8 2 18-16 30z"/><path d="M10 30h12l4-6 5 12 4-6h19"/>',
  tag: '<circle cx="32" cy="30" r="16"/><circle cx="32" cy="30" r="5"/><path d="M32 14v-6"/>',
  beacon: '<circle cx="32" cy="30" r="4"/><path d="M22 20a14 14 0 0 0 0 20M42 20a14 14 0 0 1 0 20M15 13a24 24 0 0 0 0 34M49 13a24 24 0 0 1 0 34"/>',
  house: '<path d="M10 30L32 10l22 20"/><path d="M16 26v22h32V26"/><path d="M27 48V36h10v12"/>',
  chip: '<rect x="18" y="16" width="28" height="28" rx="3"/><path d="M24 16V9M32 16V9M40 16V9M24 51v-7M32 51v-7M40 51v-7M18 24h-7M18 36h-7M53 24h-7M53 36h-7"/>',
  question: '<path d="M24 22a8 8 0 1 1 12 7c-3 2-4 3-4 7"/><circle cx="32" cy="44" r="1.5"/>',
  care: '<path d="M32 48C14 36 10 26 16 18c5-6 12-4 16 2 4-6 11-8 16-2 6 8 2 18-16 30z"/><path d="M32 22v14M25 29h14"/>',
  brush: '<rect x="28" y="22" width="8" height="30" rx="3"/><path d="M28 22V8h8v14M28 12h8M28 16h8"/>',
  bulb: '<path d="M22 26a10 10 0 1 1 20 0c0 6-5 8-5 14H27c0-6-5-8-5-14z"/><path d="M27 44h10M28 48h8"/>',
  tv: '<rect x="8" y="12" width="48" height="30" rx="3"/><path d="M24 50h16M32 42v8"/>',
  lock: '<rect x="18" y="26" width="28" height="22" rx="3"/><path d="M24 26v-6a8 8 0 0 1 16 0v6"/><circle cx="32" cy="37" r="3"/>',
  paw: '<ellipse cx="32" cy="38" rx="10" ry="8"/><circle cx="18" cy="26" r="4"/><circle cx="26" cy="18" r="4"/><circle cx="38" cy="18" r="4"/><circle cx="46" cy="26" r="4"/>',
  car: '<path d="M10 36l5-12c1-3 3-4 6-4h22c3 0 5 1 6 4l5 12v8H10z"/><path d="M10 36h44"/><circle cx="20" cy="44" r="4"/><circle cx="44" cy="44" r="4"/>',
  camera: '<rect x="8" y="18" width="48" height="30" rx="4"/><path d="M22 18l4-6h12l4 6"/><circle cx="32" cy="33" r="9"/>',
  bike: '<circle cx="16" cy="38" r="10"/><circle cx="48" cy="38" r="10"/><path d="M16 38l10-16h14l8 16M26 22l6 16h-16M40 22l-2-6h-6"/>',
  helmet: '<path d="M10 38a22 22 0 0 1 44 0v6H10z"/><path d="M32 16v10M10 38h24v6"/>',
  plug: '<rect x="20" y="22" width="24" height="18" rx="3"/><path d="M26 22V12M38 22V12M32 40v12"/>',
  sun: '<circle cx="32" cy="28" r="9"/><path d="M32 8v6M32 42v6M12 28h6M46 28h6M18 14l4 4M42 38l4 4M46 14l-4 4M22 38l-4 4"/>',
  gamepad: '<path d="M16 20h32a10 10 0 0 1 9 14l-3 8a5 5 0 0 1-9 0l-2-5H21l-2 5a5 5 0 0 1-9 0l-3-8a10 10 0 0 1 9-14z"/><path d="M20 28v6M17 31h6"/><circle cx="42" cy="29" r="1.5"/><circle cx="46" cy="33" r="1.5"/>',
  printer: '<rect x="10" y="22" width="44" height="18" rx="3"/><path d="M20 22V10h24v12M20 34h24v14H20z"/>',
  // the Wi-Fi Journal
  wifi: '<path d="M10 24a32 32 0 0 1 44 0M17 31a22 22 0 0 1 30 0M24 38a12 12 0 0 1 16 0"/><circle cx="32" cy="45" r="2"/>',
  router: '<rect x="10" y="30" width="44" height="14" rx="3"/><path d="M18 30l-4-16M46 30l4-16M18 37h4M26 37h4"/>',
  guest: '<circle cx="24" cy="20" r="6"/><circle cx="42" cy="22" r="5"/><path d="M12 46c0-8 5-14 12-14s12 6 12 14M34 46c0-6 3-11 8-11s8 5 8 11"/>',
  office: '<rect x="14" y="10" width="36" height="40" rx="2"/><path d="M22 18h6M36 18h6M22 26h6M36 26h6M22 34h6M36 34h6M28 50v-8h8v8"/>',
  mesh: '<circle cx="32" cy="14" r="5"/><circle cx="14" cy="42" r="5"/><circle cx="50" cy="42" r="5"/><path d="M29 18l-12 20M35 18l12 20M19 42h26"/>',
  gear: '<circle cx="32" cy="28" r="7"/><path d="M32 8v8M32 40v8M12 28h8M44 28h8M18 14l6 6M40 36l6 6M46 14l-6 6M24 36l-6 6"/>',
  bus: '<rect x="12" y="8" width="40" height="38" rx="5"/><path d="M12 30h40M12 18h40"/><circle cx="20" cy="38" r="2"/><circle cx="44" cy="38" r="2"/><path d="M18 46v4M46 46v4"/>',
  // the sky
  jet: '<path d="M32 6c3 0 4 4 4 8v8l18 10v5l-18-5v10l6 5v4l-10-3-10 3v-4l6-5V32l-18 5v-5l18-10v-8c0-4 1-8 4-8z"/>',
  heavy: '<path d="M32 4c4 0 5 5 5 9v8l20 11v6l-20-6v11l7 5v4l-12-3-12 3v-4l7-5V32L7 38v-6l20-11v-8c0-4 1-9 5-9z"/><path d="M14 30v-4M50 30v-4"/>',
  prop: '<path d="M32 12v34M14 24h36M26 44h12M32 12l-2-4h4z"/><path d="M22 10h20"/>',
  heli: '<path d="M10 14h44M32 14v8"/><ellipse cx="28" cy="30" rx="12" ry="8"/><path d="M40 30h16l2-4M22 40l-4 6h22"/>',
  glider: '<path d="M4 26h56M32 18v24M26 42h12M32 26l-2-8h4z"/>',
  balloon: '<path d="M32 6a16 16 0 0 0-16 16c0 10 10 18 13 24h6c3-6 13-14 13-24A16 16 0 0 0 32 6z"/><rect x="27" y="48" width="10" height="7" rx="1"/>',
  uav: '<rect x="26" y="24" width="12" height="10" rx="2"/><path d="M26 26l-10-8M38 26l10-8M26 32l-10 8M38 32l10 8"/><circle cx="14" cy="16" r="5"/><circle cx="50" cy="16" r="5"/><circle cx="14" cy="42" r="5"/><circle cx="50" cy="42" r="5"/>',
  truck: '<rect x="8" y="18" width="30" height="20" rx="2"/><path d="M38 24h10l8 8v6H38z"/><circle cx="18" cy="42" r="5"/><circle cx="46" cy="42" r="5"/>',
  mast: '<path d="M32 6v46M22 52h20M32 12l-8 40M32 12l8 40M26 26h12M24 38h16"/><circle cx="32" cy="6" r="2"/>',
  // the little radios
  thermo: '<path d="M28 34V12a4 4 0 0 1 8 0v22a9 9 0 1 1-8 0z"/><path d="M32 22v18"/>',
  tyre: '<circle cx="32" cy="29" r="20"/><circle cx="32" cy="29" r="9"/><path d="M32 9v6M32 43v6M12 29h6M46 29h6"/>',
  bell: '<path d="M20 40V26a12 12 0 0 1 24 0v14l4 4H16z"/><path d="M28 48a4 4 0 0 0 8 0"/>',
  remote: '<rect x="22" y="6" width="20" height="44" rx="5"/><circle cx="32" cy="18" r="4"/><path d="M28 30h8M28 38h8"/>',
  door: '<rect x="18" y="6" width="28" height="44" rx="1"/><circle cx="40" cy="28" r="1.5"/><path d="M10 50h44"/>',
  smoke: '<circle cx="32" cy="30" r="18"/><circle cx="32" cy="30" r="6"/><path d="M20 14c-4-6 4-8 0-12M44 14c4-6-4-8 0-12"/>',
  bolt: '<path d="M36 4L16 32h14l-4 20 22-30H34z"/>',
  meter: '<rect x="12" y="10" width="40" height="36" rx="4"/><rect x="18" y="16" width="28" height="10"/><path d="M24 38h16"/>',
  leaf: '<path d="M12 46C12 20 30 10 52 10c0 24-12 38-40 36z"/><path d="M12 46l26-24"/>',
  lightning: '<path d="M18 22a12 12 0 0 1 22-6 10 10 0 1 1 4 18H20a8 8 0 0 1-2-12z"/><path d="M32 34l-6 10h8l-4 8"/>',
  wave: '<path d="M6 30c6-12 10-12 14 0s8 12 12 0 8-12 12 0 8 12 14 0"/>',
};
function art(item) {
  if (item.shape) {          // a constellation: its stars, joined up
    const pts = item.shape.map(([x, y]) => [x * 0.56 + 4, y * 0.5 + 3]);
    const line = pts.map(p => p.join(',')).join(' ');
    return `<svg viewBox="0 0 64 56" aria-hidden="true"><polyline points="${line}" fill="none" stroke="var(--dim)"
      stroke-width="1" stroke-dasharray="${item.found ? '' : '2 3'}"/>${pts.map(([x, y], i) =>
      `<circle cx="${x}" cy="${y}" r="${i % 3 ? 2 : 3}" fill="${item.found ? 'var(--rune)' : 'var(--dim)'}"/>`).join('')}</svg>`;
  }
  return `<svg viewBox="0 0 64 56" aria-hidden="true" fill="none" stroke="${item.found === false ? 'var(--dim)' : 'var(--rune)'}"
    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${ICONS[item.icon] || ICONS.question}</svg>`;
}
function cardHtml(item, extra) {
  const unit = item.unit || 'type';
  const meta = extra ? `<span>${item.count} ${item.count === 1 ? unit : (item.units || unit + 's')}</span>`
    : `<span class="chip ${esc(item.rarity)}">${esc(item.rarity)}</span><span>${item.found
        ? (DATA.kind === 'stars' ? `${item.count} star${item.count === 1 ? '' : 's'}${item.now ? ` · <span class="now">${item.now} now</span>` : ''}`
                                 : esc(item.sub)) : 'Not found yet'}</span>`;
  return `<button class="card${item.found === false ? ' missing' : ''}" data-id="${esc(item.id)}" aria-haspopup="dialog">
    <div class="art">${art(item)}</div><div class="name" data-nolang>${esc(item.title)}</div><div class="meta">${meta}</div></button>`;
}
const BY_ID = {};
function draw() {
  $('title').textContent = DATA.title;
  $('subtitle').textContent = DATA.subtitle;
  $('intro').textContent = DATA.intro + (DATA.rules ? ' ' + DATA.rules : '');
  if (DATA.score) {
    const s = DATA.score;
    $('score').hidden = false;
    $('score').innerHTML = `<b>${s.points.toLocaleString()}</b> ${esc(s.what)} · <b style="color:var(--rune)">${esc(s.title)}</b>`
      + (s.next ? ` <span class="sub">(${(s.next_at - s.points).toLocaleString()} to ${esc(s.next)})</span>` : '');
  }
  $('explainTitle').textContent = DATA.explain_title;
  $('explainBody').innerHTML = DATA.explain.map(([h, p]) => `<h3>${esc(h)}</h3><p>${esc(p)}</p>`).join('');
  $('groups').innerHTML = DATA.groups.map(g => {
    g.items.forEach(i => BY_ID[i.id] = i);
    const n = g.items.filter(i => i.found).length;
    return `<h2>${esc(g.name)} <span class="sub">${n} of ${g.items.length}</span></h2>
      <div class="grid">${g.items.map(i => cardHtml(i)).join('')}</div>`;
  }).join('');
  $('extras').innerHTML = DATA.extras.length ? `<h2>Field finds</h2>
    <p class="sub">Everything else ${esc(DATA.name)} has eaten, by what each gadget said about itself.</p>
    <div class="grid">${DATA.extras.map(x => { BY_ID[x.id] = x; return cardHtml(x, true); }).join('')}</div>` : '';
}
let opener = null;
function openCard(id, from) {
  const item = BY_ID[id];
  if (!item) return;
  const c = item.card, m = c.mine || {};
  opener = from;
  const facts = (c.facts || []).map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('');
  const list = (m.list || []);
  const mine = item.found === false ? `<p class="empty">Not found yet.</p>`
    : `<h3 style="margin:0;font-size:14px">${DATA.kind === 'stars' ? 'Stars found' : 'Found'}</h3>
       ${m.first ? `<p class="sub" style="margin:2px 0">First found ${esc(new Date(m.first * 1000).toLocaleDateString())}${m.count ? (m.what ? ` · ${m.count.toLocaleString()} ${esc(m.what)}` : ` · eaten ${m.count}×`) : ''}</p>` : ''}
       ${m.note ? `<p class="sub" style="margin:2px 0">${esc(m.note)}</p>` : ''}
       ${list.length ? `<ul data-nolang>${list.map(x => `<li class="${x.bold ? 'bold' : ''}">${x.bold ? '<b>' : ''}${esc(x.label)}${x.bold ? '</b>' : ''}<span>${esc(x.sub)}${x.bold ? ' · in view now' : ''}</span></li>`).join('')}</ul>` : ''}`;
  $('sheetBox').innerHTML = `<div class="top"><div class="art">${art(item)}</div>
      <div><h2 id="cardTitle" data-nolang>${esc(c.title)}</h2><div class="sub">${c.rarity ? `<span class="chip ${esc(c.rarity)}">${esc(c.rarity)}</span> ` : ''}${esc(c.group || '')}</div></div>
      <button class="close" id="closeBtn" aria-label="Close">✕</button></div>
    ${facts ? `<table class="facts">${facts}</table>` : ''}
    ${(c.text || []).map(p => `<p>${esc(p)}</p>`).join('')}
    ${c.dyk ? `<p class="dyk"><b>Did you know?</b> ${esc(c.dyk)}</p>` : ''}
    <div class="mine">${mine}</div>
    ${(c.sources || []).length ? `<div class="sources sub">Sources<ul>${c.sources.map(([t, u]) =>
      `<li><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t)}</a></li>`).join('')}</ul></div>` : ''}`;
  $('sheet').hidden = false;
  $('closeBtn').onclick = closeCard;
  $('closeBtn').focus();
}
function closeCard() { $('sheet').hidden = true; if (opener) opener.focus(); }
document.addEventListener('click', e => {
  const b = e.target.closest('.card');
  if (b) openCard(b.dataset.id, b);
  else if (e.target === $('sheet')) closeCard();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheet').hidden) closeCard(); });
draw();
</script>
</body>
</html>
